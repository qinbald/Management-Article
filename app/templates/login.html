{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-header text-center bg-primary text-white">
                <h4>Login Sistem</h4>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Belum punya akun? <a href="{{ url_for('main.register_page') }}">Daftar di sini</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); 

        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;

        // Sesuaikan dengan blueprint_route Anda
        fetch("{{ url_for('module_name.login') }}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: usernameInput,
                password: passwordInput
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Opsional: Anda bisa menyapa berdasarkan role yang dikembalikan backend
                alert(`${data.messages}! Selamat datang, Anda login sebagai ${data.role}.`); 
                window.location.href = "{{ url_for('main.home') }}"; 
            } else {
                alert("Gagal: " + data.messages); 
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Terjadi kesalahan pada server saat login.");
        });
    });
</script>
{% endblock %}
