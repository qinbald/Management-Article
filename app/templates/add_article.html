{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Tambah Artikel Baru</h4>
            </div>
            <div class="card-body">
                <!-- Form untuk input data artikel -->
                <form id="formTambahArtikel">
                    <div class="mb-3">
                        <label for="title" class="form-label">Judul Artikel</label>
                        <input type="text" class="form-control" id="title" name="title" required placeholder="Masukkan judul artikel...">
                    </div>
                    <div class="mb-3">
                        <label for="author" class="form-label">Nama Penulis</label>
                        <input type="text" class="form-control" id="author" name="author" required placeholder="Contoh: Budi">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Isi / Deskripsi Artikel</label>
                        <textarea class="form-control" id="description" name="description" rows="5" required placeholder="Tuliskan isi artikelmu di sini..."></textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('main.artikel_page') }}" class="btn btn-outline-secondary">Batal & Kembali</a>
                        <button type="submit" class="btn btn-primary">Simpan Artikel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Skrip JavaScript untuk Fetch Simpan Artikel -->
<script>
    document.getElementById('formTambahArtikel').addEventListener('submit', function(event) {
        event.preventDefault(); // Mencegah halaman reload

        // Mengambil nilai dari form input
        const inputTitle = document.getElementById('title').value;
        const inputAuthor = document.getElementById('author').value;
        const inputDescription = document.getElementById('description').value;

        // Mengirim data ke backend Flask menggunakan Fetch
        fetch("{{ url_for('module_name.add_article') }}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                title: inputTitle,
                author: inputAuthor,
                description: inputDescription
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.messages); // Menampilkan notifikasi sukses
                // Mengembalikan pengguna ke halaman daftar artikel
                window.location.href = "{{ url_for('main.artikel_page') }}";
            } else {
                alert("Gagal: " + data.messages); // Menampilkan pesan gagal
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Terjadi kesalahan saat menyimpan data ke server.");
        });
    });
</script>
{% endblock %}
