{% extends "base.html" %}

{% block content %}
<!-- Bagian Header Admin -->
<div class="p-4 mb-4 bg-white rounded-3 shadow-sm border mt-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center">
    <div>
        <h2 class="fw-bold mb-1 text-dark">Admin Dashboard</h2>
        <p class="text-muted mb-0" id="welcome-message">Memuat informasi...</p>
    </div>
    <div class="mt-3 mt-md-0">
        <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary btn-sm">Kembali ke Home</a>
    </div>
</div>

<!-- Bagian Tabel Data Pengguna -->
<div class="card shadow-sm border-0 rounded-3 bg-white mb-5">
    <div class="card-header bg-white border-bottom py-3 px-4">
        <h5 class="mb-0 fw-bold text-primary">Daftar Pengguna Sistem</h5>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="px-4 py-3">ID</th>
                        <th class="py-3">Username</th>
                        <th class="py-3">Email</th>
                        <th class="py-3">Role</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- Efek Loading sebelum data muncul -->
                    <tr>
                        <td colspan="4" class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Memuat...</span>
                            </div>
                            <p class="mt-2 text-muted mb-0">Mengambil data pengguna...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Skrip JavaScript untuk melakukan Fetch ke Backend -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const tableBody = document.getElementById('user-table-body');
        const welcomeMessage = document.getElementById('welcome-message');

        fetch("{{ url_for('main.admin_dashboard') }}", {
            method: 'POST', 
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                welcomeMessage.textContent = data.messages;
                tableBody.innerHTML = ''; 

                if (data.data.length > 0) {
                    let htmlContent = "";
                    data.data.forEach(user => {
                        let roleBadge = user.role === 'admin' 
                            ? `<span class="badge bg-primary bg-opacity-10 text-primary border border-primary rounded-pill px-3">Admin</span>` 
                            : `<span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary rounded-pill px-3">User</span>`;

                        htmlContent += `
                            <tr>
                                <td class="px-4 py-3 text-muted">#${user.id}</td>
                                <td class="fw-semibold py-3 text-dark">${user.username}</td>
                                <td class="py-3 text-muted">${user.email}</td>
                                <td class="py-3">${roleBadge}</td>
                            </tr>
                        `;
                    });
                    tableBody.innerHTML = htmlContent;
                } else {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center py-5 text-muted">Belum ada data pengguna yang terdaftar.</td>
                        </tr>
                    `;
                }
            } else {
                welcomeMessage.textContent = "Gagal memuat dashboard.";
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-5 text-danger">Gagal mengambil data dari server.</td>
                    </tr>
                `;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            welcomeMessage.textContent = "Terjadi kesalahan sistem.";
            tableBody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center py-5 text-danger">
                        Terjadi kesalahan pada sistem saat memuat data.
                    </td>
                </tr>
            `;
        });
    });
</script>
{% endblock %}
