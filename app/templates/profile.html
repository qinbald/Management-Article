{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <!-- Bagian Kiri: Kartu Info Profil -->
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm border-0">
            <div class="card-body text-center py-4">
                <!-- Avatar Dummy -->
                <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff&size=100" 
                     id="profileAvatar" 
                     class="rounded-circle mb-3 shadow-sm" alt="Avatar">
                
                <h4 class="fw-bold text-dark mb-1" id="userName">Memuat...</h4>
                <p class="text-muted mb-2">Role: <span id="userRole" class="badge bg-primary">...</span></p>
                <p class="text-muted small">User ID: <span id="userId">...</span></p>
            </div>
        </div>
    </div>

    <!-- Bagian Kanan: Daftar Artikel -->
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold">Daftar Artikel Saya</h5>
                <!-- Tombol ini diarahkan ke route form tambah artikel Anda -->
                <a href="{{ url_for('main.add_article') }}" class="btn btn-primary btn-sm">+ Buat Artikel</a>
            </div>
            <div class="card-body p-0">
                <ul class="list-group list-group-flush" id="articleList">
                    <!-- Tampilan Loading -->
                    <li class="list-group-item text-center text-muted py-4">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div> 
                        Mengambil data artikel...
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<!-- SCRIPT UNTUK MENGAMBIL DATA DARI BACKEND -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Karena BE menggunakan metode POST, kita sesuaikan fetch-nya
    fetch("{{ url_for('module_name.profil_user') }}", {
        method: "POST", // Memaksa fetch menggunakan POST
        headers: {
            "Content-Type": "application/json"
        }
    })
        .then(response => {
            if (!response.ok) {
                // Tangkap HTTP error (seperti 400 Bad Request)
                throw new Error("HTTP error " + response.status);
            }
            return response.json();
        })
        .then(data => {
            // 1. Jika gagal (misal belum login)
            if (!data.success) {
                alert(data.messages);
                window.location.href = "{{ url_for('main.login_page') }}"; // Redirect ke login
                return;
            }

            // 2. Jika sukses, masukkan data profil ke dalam HTML
            document.getElementById("userName").textContent = data.user.username;
            document.getElementById("userRole").textContent = data.user.role.toUpperCase();
            document.getElementById("userId").textContent = data.user.id;
            
            // Ubah gambar avatar sesuai nama user
            document.getElementById("profileAvatar").src = `https://ui-avatars.com/api/?name=${data.user.username}&background=0D8ABC&color=fff&size=100`;

            // 3. Masukkan data artikel ke dalam HTML
            const articleList = document.getElementById("articleList");
            articleList.innerHTML = ""; // Bersihkan tampilan loading

            // Cek apakah list article kosong
            if (data.article.length === 0) {
                articleList.innerHTML = `<li class="list-group-item text-center text-muted py-4">Anda belum menulis artikel.</li>`;
            } else {
                // Looping artikel berdasarkan response BE terbaru
                data.article.forEach(art => {
                    let li = document.createElement("li");
                    li.className = "list-group-item py-3 d-flex justify-content-between align-items-center";
                    li.innerHTML = `<span class="fw-semibold">${art.title}</span>`;
                    articleList.appendChild(li);
                });
            }
        })
        .catch(error => {
            console.error("Error fetching data:", error);
            document.getElementById("articleList").innerHTML = 
                `<li class="list-group-item text-center text-danger py-4">Gagal memuat data dari server. Pastikan Anda sudah login.</li>`;
            document.getElementById("userName").textContent = "Belum Login";
        });
});
</script>
{% endblock %}
