<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Artikel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; padding-bottom: 50px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .card-header { font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">Sistem Manajemen Artikel (Flask API)</h2>
    
    <div id="alert-box"></div>

    <div class="row">
        <div class="col-md-4">
            
            <div class="card">
                <div class="card-header bg-primary text-white">Registrasi User</div>
                <div class="card-body">
                    <form id="register-form">
                        <div class="mb-2">
                            <input type="text" id="reg-username" class="form-control" placeholder="Username" required>
                        </div>
                        <div class="mb-2">
                            <input type="email" id="reg-email" class="form-control" placeholder="Email" required>
                        </div>
                        <div class="mb-2">
                            <input type="password" id="reg-password" class="form-control" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Daftar</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-success text-white">Login User</div>
                <div class="card-body">
                    <form id="login-form">
                        <div class="mb-2">
                            <input type="text" id="log-username" class="form-control" placeholder="Username" required>
                        </div>
                        <div class="mb-2">
                            <input type="password" id="log-password" class="form-control" placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Login</button>
                    </form>
                </div>
            </div>
            
        </div>

        <div class="col-md-8">
            
            <div class="card">
                <div class="card-header bg-dark text-white">Tambah Artikel Baru</div>
                <div class="card-body">
                    <form id="article-form">
                        <div class="mb-2">
                            <input type="text" id="art-title" class="form-control" placeholder="Judul Artikel (Title)" required>
                        </div>
                        <div class="mb-2">
                            <input type="text" id="art-author" class="form-control" placeholder="Nama Penulis" required>
                        </div>
                        <div class="mb-2">
                            <textarea id="art-desc" class="form-control" placeholder="Deskripsi Artikel" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark">Simpan Artikel</button>
                    </form>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header bg-info text-white">Cari Artikel</div>
                        <div class="card-body">
                            <div class="input-group mb-3">
                                <input type="text" id="search-title" class="form-control" placeholder="Masukkan Judul Artikel...">
                                <button class="btn btn-info text-white" onclick="searchArticle()">Cari</button>
                            </div>
                            <div id="search-result" class="mt-2 text-muted" style="font-size: 0.9em;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header bg-danger text-white">Hapus Artikel</div>
                        <div class="card-body">
                            <div class="input-group">
                                <input type="text" id="del-title" class="form-control" placeholder="Masukkan Judul yang dihapus">
                                <button class="btn btn-danger" onclick="deleteArticle()">Hapus</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // --- FUNGSI NOTIFIKASI ALERT ---
    function showAlert(message, type='success') {
        const alertBox = document.getElementById('alert-box');
        alertBox.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
    }

    // --- 1. REGISTRASI ---
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            username: document.getElementById('reg-username').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value
        };

        try {
            const res = await fetch('/registrasi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            // Menangkap respon 'messsages' (typo dari BE) atau 'messages'
            showAlert(result.messsages || result.messages || "Registrasi diproses", res.ok ? 'success' : 'danger');
            if(res.ok) document.getElementById('register-form').reset();
        } catch (err) { showAlert("Terjadi kesalahan sistem", 'danger'); }
    });

    // --- 2. LOGIN ---
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            username: document.getElementById('log-username').value,
            password: document.getElementById('log-password').value
        };

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            showAlert(result.messages || "Login diproses", res.ok ? 'success' : 'danger');
            if(res.ok) document.getElementById('login-form').reset();
        } catch (err) { showAlert("Terjadi kesalahan sistem", 'danger'); }
    });

    // --- 3. TAMBAH ARTIKEL ---
    document.getElementById('article-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        // Menggunakan properti "title" sesuai dengan perbaikan backend
        const data = {
            title: document.getElementById('art-title').value,
            author: document.getElementById('art-author').value,
            description: document.getElementById('art-desc').value
        };

        try {
            // Mengikuti nama route di BE kamu: /add_articel
            const res = await fetch('/add_articel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            showAlert(result.messages || "Artikel diproses", res.ok ? 'success' : 'danger');
            if(res.ok) document.getElementById('article-form').reset();
        } catch (err) { showAlert("Terjadi kesalahan sistem", 'danger'); }
    });

    // --- 4. HAPUS ARTIKEL ---
    async function deleteArticle() {
        const title = document.getElementById('del-title').value;
        if (!title) return showAlert("Judul yang ingin dihapus tidak boleh kosong!", 'warning');

        try {
            const res = await fetch(`/delete_article/${encodeURIComponent(title)}`, {
                method: 'POST' 
            });
            const result = await res.json();
            
            if(res.ok) {
                showAlert(result.messages || `Artikel '${title}' telah dihapus.`, 'success');
                document.getElementById('del-title').value = '';
            } else {
                showAlert(result.messages || `Artikel tidak ditemukan atau gagal dihapus`, 'danger');
            }
        } catch (err) { showAlert("Terjadi kesalahan koneksi", 'danger'); }
    }

    // --- 5. CARI ARTIKEL ---
    async function searchArticle() {
        const title = document.getElementById('search-title').value;
        const resultBox = document.getElementById('search-result');
        
        if (!title) {
            resultBox.innerHTML = '<span class="text-danger">Masukkan judul terlebih dahulu!</span>';
            return;
        }

        try {
            resultBox.innerHTML = 'Mencari data...';
            // Hit ke endpoint GET menggunakan query parameter
            const res = await fetch(`/get_title_or_author?title=${encodeURIComponent(title)}`);
            const result = await res.json();

            if (res.ok) {
                resultBox.innerHTML = `
                    <div class="alert alert-success p-2 mb-0">
                        <strong>Ditemukan!</strong><br>
                        Judul: ${result.title} <br>
                        Penulis: ${result.author}
                    </div>`;
            } else {
                resultBox.innerHTML = `<span class="text-danger">${result.messages || "Artikel tidak ditemukan"}</span>`;
            }
        } catch (err) {
            resultBox.innerHTML = '<span class="text-danger">Terjadi kesalahan.</span>';
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
