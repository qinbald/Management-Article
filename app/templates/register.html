{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-5">
            <div class="card-header text-center bg-success text-white">
                <h4>Daftar Akun Baru</h4>
            </div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <!-- Tambahan Pilihan Role -->
                    <div class="mb-4">
                        <label for="role" class="form-label">Daftar Sebagai (Role)</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" selected disabled>Pilih Role...</option>
                            <option value="user">User / Pembaca</option>
                            <option value="admin">Admin / Penulis</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Daftar</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Sudah punya akun? <a href="{{ url_for('main.login_page') }}">Login di sini</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(event) {
        event.preventDefault(); 

        const usernameInput = document.getElementById('username').value;
        const emailInput = document.getElementById('email').value;
        const passwordInput = document.getElementById('password').value;
        const roleInput = document.getElementById('role').value;

        // Sesuaikan dengan blueprint_route Anda
        fetch("{{ url_for('module_name.registrasi') }}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username: usernameInput,
                email: emailInput,
                password: passwordInput,
                role: roleInput
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.messages); 
                window.location.href = "{{ url_for('main.login_page') }}"; 
            } else {
                alert("Gagal: " + data.messages); 
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Terjadi kesalahan pada server saat registrasi.");
        });
    });
</script>
{% endblock %}
